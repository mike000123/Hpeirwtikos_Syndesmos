# Πίνακας ελέγχου του site (Sveltia CMS). Οδηγίες: admin/odigos.html
backend:
  name: github
  repo: mike000123/Hpeirwtikos_Syndesmos
  branch: main
  commit_messages:
    create: 'Νέο: {{collection}} «{{slug}}»'
    update: 'Ενημέρωση: {{collection}} «{{slug}}»'
    delete: 'Διαγραφή: {{collection}} «{{slug}}»'
    uploadMedia: 'Αρχείο: {{path}}'
    deleteMedia: 'Διαγραφή αρχείου: {{path}}'
site_url: https://mike000123.github.io/Hpeirwtikos_Syndesmos/
display_url: https://mike000123.github.io/Hpeirwtikos_Syndesmos/
media_folder: assets/uploads
public_folder: assets/uploads

collections:
# BEGIN page-index (δημιουργείται αυτόματα από scripts/pages_spec.py)
  - name: page_index
    label: 'Αρχική'
    description: 'Κείμενα και εικόνες της αρχικής σελίδας. Επιλέξτε ενότητα.'
    files:
      - name: index_g01
        label: 'Κεφαλίδα'
        file: content/pages/index/g01.json
        format: json
        fields:
          - {name: hero_eyebrow, label: 'Κεφαλίδα · μικρός τίτλος', widget: string, required: false}
          - {name: hero_title, label: 'Κεφαλίδα · τίτλος', widget: text, required: false}
          - {name: hero_text, label: 'Κεφαλίδα · κείμενο', widget: text, required: false}
          - {name: hero_btn1, label: 'Κεφαλίδα · κουμπί 1', widget: string, required: false}
          - {name: hero_btn2, label: 'Κεφαλίδα · κουμπί 2', widget: string, required: false}
      - name: index_g02
        label: 'Εισαγωγή'
        file: content/pages/index/g02.json
        format: json
        fields:
          - {name: intro_title, label: 'Εισαγωγή · τίτλος', widget: text, required: false}
          - {name: intro_text, label: 'Εισαγωγή · κείμενο', widget: text, required: false}
      - name: index_g03
        label: 'Λέσχη'
        file: content/pages/index/g03.json
        format: json
        fields:
          - {name: club_image, label: 'Λέσχη · φωτογραφία', widget: image, required: false}
          - {name: club_image_alt, label: 'Λέσχη · περιγραφή φωτογραφίας', widget: string, required: false}
          - {name: club_eyebrow, label: 'Λέσχη · μικρός τίτλος', widget: string, required: false}
          - {name: club_title, label: 'Λέσχη · τίτλος', widget: text, required: false}
          - {name: club_text, label: 'Λέσχη · κείμενο', widget: text, required: false}
          - {name: club_link, label: 'Λέσχη · κείμενο συνδέσμου', widget: string, required: false}
      - name: index_g04
        label: 'Χορευτικά'
        file: content/pages/index/g04.json
        format: json
        fields:
          - {name: dance_eyebrow, label: 'Χορευτικά · μικρός τίτλος', widget: string, required: false}
          - {name: dance_title, label: 'Χορευτικά · τίτλος', widget: text, required: false}
          - {name: dance_text, label: 'Χορευτικά · κείμενο', widget: text, required: false}
          - {name: dance_btn, label: 'Χορευτικά · κουμπί', widget: string, required: false}
          - {name: dance_tag, label: 'Χορευτικά · σλόγκαν', widget: string, required: false}
      - name: index_g05
        label: 'Άνθρωποι'
        file: content/pages/index/g05.json
        format: json
        fields:
          - {name: community_image, label: 'Άνθρωποι · φωτογραφία', widget: image, required: false}
          - {name: community_eyebrow, label: 'Άνθρωποι · μικρός τίτλος', widget: string, required: false}
          - {name: community_title, label: 'Άνθρωποι · τίτλος', widget: string, required: false}
          - {name: community_text, label: 'Άνθρωποι · κείμενο', widget: text, required: false}
          - {name: community_link, label: 'Άνθρωποι · κείμενο συνδέσμου', widget: string, required: false}
      - name: index_g06
        label: 'Δραστηριότητες'
        file: content/pages/index/g06.json
        format: json
        fields:
          - {name: act_eyebrow, label: 'Δραστηριότητες · μικρός τίτλος', widget: string, required: false}
          - {name: act_title, label: 'Δραστηριότητες · τίτλος', widget: string, required: false}
          - {name: act1_title, label: 'Δραστηριότητα 1 · τίτλος', widget: string, required: false}
          - {name: act1_text, label: 'Δραστηριότητα 1 · κείμενο', widget: text, required: false}
          - {name: act1_link, label: 'Δραστηριότητα 1 · σύνδεσμος', widget: string, required: false}
          - {name: act2_title, label: 'Δραστηριότητα 2 · τίτλος', widget: string, required: false}
          - {name: act2_text, label: 'Δραστηριότητα 2 · κείμενο', widget: text, required: false}
          - {name: act2_link, label: 'Δραστηριότητα 2 · σύνδεσμος', widget: string, required: false}
          - {name: act3_title, label: 'Δραστηριότητα 3 · τίτλος', widget: string, required: false}
          - {name: act3_text, label: 'Δραστηριότητα 3 · κείμενο', widget: text, required: false}
          - {name: act3_link, label: 'Δραστηριότητα 3 · σύνδεσμος', widget: string, required: false}
      - name: index_g07
        label: 'Γνωρίστε την Ήπειρο'
        file: content/pages/index/g07.json
        format: json
        fields:
          - {name: gate_eyebrow, label: 'Γνωρίστε την Ήπειρο · μικρός τίτλος', widget: string, required: false}
          - {name: gate_title, label: 'Γνωρίστε την Ήπειρο · τίτλος', widget: string, required: false}
          - {name: gate_text, label: 'Γνωρίστε την Ήπειρο · κείμενο', widget: text, required: false}
          - {name: gate_btn, label: 'Γνωρίστε την Ήπειρο · κουμπί', widget: string, required: false}
      - name: index_g08
        label: 'Επικοινωνία'
        file: content/pages/index/g08.json
        format: json
        fields:
          - {name: contact_eyebrow, label: 'Επικοινωνία · μικρός τίτλος', widget: string, required: false}
          - {name: contact_title, label: 'Επικοινωνία · τίτλος', widget: string, required: false}
          - {name: contact_text, label: 'Επικοινωνία · κείμενο', widget: text, required: false}
          - {name: contact_btn, label: 'Επικοινωνία · κουμπί', widget: string, required: false}
# END page-index
  - name: board
    label: 'Ο Σύνδεσμος'
    description: 'Σελίδα «Ο Σύνδεσμος»: Διοικητικό Συμβούλιο και πρόεδροι.'
    files:
      - name: board
        label: Διοικητικό Συμβούλιο και πρόεδροι
        file: content/board.json
        format: json
        fields:
          - name: members
            label: Αξιωματούχοι του ΔΣ
            label_singular: Μέλος
            widget: list
            summary: '{{fields.role}} · {{fields.name}}'
            fields:
              - {name: role, label: Ιδιότητα (π.χ. Πρόεδρος), widget: string}
              - {name: name, label: Ονοματεπώνυμο, widget: string}
          - {name: councillors, label: Σύμβουλοι (χωρισμένοι με κόμμα), widget: text}
          - {name: substitutes, label: Αναπληρωματικοί (χωρισμένοι με κόμμα), widget: text, required: false}
          - {name: representatives, label: Εκπρόσωποι στην Πανηπειρωτική Συνομοσπονδία (χωρισμένοι με κόμμα), widget: text, required: false}
          - name: presidents
            label: Πρόεδροι από το 1906 (με χρονολογική σειρά)
            label_singular: Πρόεδρος
            widget: list
            summary: '{{fields.name}} · {{fields.period}}'
            fields:
              - {name: name, label: Ονοματεπώνυμο, widget: string}
              - {name: period, label: 'Περίοδος (π.χ. 2009–2023)', widget: string}
              - {name: portrait, label: Πορτρέτο προέδρου, widget: image, required: false, hint: 'Πραγματική φωτογραφία του συγκεκριμένου προέδρου. Αν μείνει κενό, εμφανίζονται τα αρχικά του.'}
              - {name: portrait_source, label: Σύνδεσμος πηγής φωτογραφίας, widget: string, required: false}
              - {name: portrait_credit, label: Προέλευση φωτογραφίας, widget: string, required: false, hint: 'Σύντομη αναφορά, π.χ. Αρχείο Συνδέσμου.'}

  - name: events
    label: 'Εκδηλώσεις'
    description: 'Σελίδα «Εκδηλώσεις»: προσθέστε νέα εκδήλωση (μελλοντική ημερομηνία = «επόμενες συναντήσεις») ή διορθώστε παλιά.'
    label_singular: Εκδήλωση
    folder: content/events
    extension: json
    format: json
    create: true
    delete: true
    slug: '{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}'
    summary: '{{date}} · {{title}}'
    sortable_fields: [date, title]
    fields:
      - {name: id, widget: hidden}
      - {name: title, label: Τίτλος εκδήλωσης, widget: string}
      - {name: date, label: Ημερομηνία, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true, required: false, hint: 'Η ημερομηνία που έγινε η εκδήλωση.'}
      - {name: dateLabel, label: Ειδική εμφάνιση ημερομηνίας (προαιρετικό), widget: string, required: false, hint: 'Αφήστε κενό. Συμπληρώστε μόνο αν θέλετε π.χ. «Οκτώβριος 2011».'}
      - {name: source, label: Σύνδεσμος σε σελίδα με περισσότερα (προαιρετικό), widget: string, required: false}
      - {name: note, label: Σημείωση (προαιρετικό), widget: text, required: false}
      - name: press
        label: Ανακοίνωση / αφίσα
        widget: object
        required: false
        collapsed: false
        fields:
          - {name: src, label: Αρχείο ανακοίνωσης (εικόνα JPG ή PDF), widget: file, media_folder: assets/event-press, public_folder: assets/event-press, required: false}
          - {name: label, label: Τίτλος αρχείου, widget: string, default: Ανακοίνωση, required: false}
          - {name: format, widget: hidden}
          - {name: originalSrc, widget: hidden}
          - {name: pages, widget: hidden}
      - name: media
        label: Φωτογραφίες και βίντεο
        label_singular: Φωτογραφία / βίντεο
        widget: list
        required: false
        summary: '{{fields.type}} · {{fields.caption}}'
        fields:
          - {name: type, label: Είδος, widget: select, options: [{label: Φωτογραφία, value: photo}, {label: Βίντεο YouTube, value: video}], default: photo}
          - {name: src, label: Φωτογραφία, widget: image, media_folder: assets/event-media, public_folder: assets/event-media, required: false}
          - {name: videoId, label: 'Κωδικός βίντεο YouTube (το τμήμα μετά το v= στη διεύθυνση)', widget: string, required: false}
          - {name: caption, label: Λεζάντα, widget: string}
          - {name: originalFile, widget: hidden}
          - {name: sourcePage, widget: hidden}
          - {name: retrieval, widget: hidden}

  - name: ipeiros
    label: 'Γνωρίστε την Ήπειρο'
    description: 'Σελίδα «Γνωρίστε την Ήπειρο». Επιλέξτε ενότητα. Τα άρθρα της βρίσκονται στην επόμενη καταχώρηση.'
    files:
      - name: hero
        label: '1. Κεφαλίδα'
        file: content/ipeiros/hero.json
        format: json
        fields:
          - {name: eyebrow, label: Μικρός τίτλος πάνω από τον τίτλο, widget: string}
          - {name: line1, label: Τίτλος · γραμμή 1, widget: string}
          - {name: line2_pre, label: Τίτλος · γραμμή 2 (κανονικά γράμματα), widget: string}
          - {name: line2_em, label: Τίτλος · γραμμή 2 (πλάγια γράμματα), widget: string}
          - {name: line3, label: Τίτλος · γραμμή 3, widget: string}
          - {name: intro, label: Εισαγωγικό κείμενο, widget: text}
          - {name: button1_text, label: Κουμπί 1 · κείμενο, widget: string}
          - {name: button1_link, label: 'Κουμπί 1 · σελίδα (π.χ. #discover)', widget: string}
          - {name: button2_text, label: Κουμπί 2 · κείμενο, widget: string}
          - {name: button2_link, label: Κουμπί 2 · σελίδα (π.χ. syndesmos.html), widget: string}
      - name: discover
        label: '2. «Μια πατρίδα, χίλιες ιστορίες» (κάρτες θεμάτων)'
        file: content/ipeiros/discover.json
        format: json
        fields:
          - {name: eyebrow, label: Μικρός τίτλος, widget: string}
          - {name: title, label: Τίτλος, widget: string}
          - {name: intro, label: Κείμενο, widget: text}
          - name: tiles
            label: Κάρτες
            label_singular: Κάρτα
            widget: list
            summary: '{{fields.title}}'
            fields:
              - {name: title, label: Τίτλος κάρτας, widget: string}
              - {name: kicker, label: 'Μικρός τίτλος (π.χ. 01 / Τόποι)', widget: string}
              - {name: text, label: Σύντομο κείμενο, widget: text}
              - {name: arrow, label: Κείμενο συνδέσμου (π.χ. Ανακαλύψτε →), widget: string}
              - {name: link, label: 'Σελίδα που ανοίγει (π.χ. topoi.html)', widget: string}
              - {name: image, label: Εικόνα, widget: image}
              - {name: alt, label: Περιγραφή εικόνας (για άτομα με πρόβλημα όρασης), widget: string}
              - {name: wrap_figure, widget: hidden}
              - {name: img_tpl, widget: hidden}
      - name: culture
        label: '3. «Τέχνες, τελετουργίες, άνθρωποι» (λαογραφικά αφιερώματα)'
        file: content/ipeiros/culture.json
        format: json
        fields:
          - {name: eyebrow, label: Μικρός τίτλος, widget: string}
          - {name: title, label: Τίτλος, widget: string}
          - {name: intro, label: Κείμενο δίπλα στον τίτλο, widget: text}
          - {name: lead, label: Εισαγωγική παράγραφος, widget: text}
          - name: cards
            label: Κάρτες αφιερωμάτων (τα νέα άρθρα προστίθενται αυτόματα μετά από αυτές)
            label_singular: Κάρτα
            widget: list
            summary: '{{fields.title}}'
            fields:
              - {name: title, label: Τίτλος, widget: string}
              - {name: chapter, label: 'Αρίθμηση / κατηγορία (π.χ. 01 / Τέχνη & μαστοριά)', widget: string}
              - {name: kicker, label: Λέξεις-κλειδιά, widget: string}
              - {name: text, label: Κείμενο, widget: text}
              - {name: link, label: 'Σελίδα άρθρου (π.χ. asimi.html)', widget: string}
              - {name: image, label: Εικόνα, widget: image}
              - {name: alt, label: Περιγραφή εικόνας, widget: string}
              - {name: ext_link, label: Εξωτερικός σύνδεσμος (προαιρετικό), widget: string, required: false}
              - {name: ext_label, label: Κείμενο εξωτερικού συνδέσμου, widget: string, required: false}
          - {name: feature_title, label: Πλαίσιο κάτω από τις κάρτες · τίτλος, widget: string}
          - {name: feature_text, label: Πλαίσιο κάτω από τις κάρτες · κείμενο, widget: text}
      - name: heritage
        label: '4. «Η μνήμη χρειάζεται φωνή» (αρχείο)'
        file: content/ipeiros/heritage.json
        format: json
        fields:
          - {name: eyebrow, label: Μικρός τίτλος, widget: string}
          - {name: title, label: Τίτλος, widget: string}
          - {name: intro, label: Κείμενο, widget: text}
          - name: items
            label: Θέματα του αρχείου
            label_singular: Θέμα
            widget: list
            summary: '{{fields.title}}'
            fields:
              - {name: title, label: Τίτλος, widget: string}
              - {name: kicker, label: Κατηγορία που εμφανίζεται, widget: string}
              - {name: category, label: Κατηγορία για τα φίλτρα, widget: select, options: [μουσική, λαογραφία, ιστορία, τέχνες]}
              - {name: text, label: Κείμενο, widget: text}
              - {name: link, label: Σελίδα (π.χ. polyfoniko.html), widget: string}
              - {name: keywords, label: Λέξεις για την αναζήτηση (πεζά, χωρισμένες με κενό), widget: string}
              - {name: image, label: Εικόνα, widget: image}
              - {name: alt, label: Περιγραφή εικόνας, widget: string}
              - {name: wrap_cover, widget: hidden}
              - {name: img_tpl, widget: hidden}
          - {name: note, label: Σημείωση κάτω από το αρχείο, widget: text}
      - name: stories
        label: '5. «Η Ήπειρος πέρα από τις λέξεις» (φωτογραφικά αφιερώματα)'
        file: content/ipeiros/stories.json
        format: json
        fields:
          - {name: eyebrow, label: Μικρός τίτλος, widget: string}
          - {name: title, label: Τίτλος, widget: string}
          - {name: intro, label: Κείμενο, widget: text}
          - name: cards
            label: Κάρτες
            label_singular: Κάρτα
            widget: list
            summary: '{{fields.title}}'
            fields:
              - {name: title, label: Τίτλος, widget: string}
              - {name: kicker, label: Μικρός τίτλος (π.χ. Φωτογραφικό αφιέρωμα), widget: string}
              - {name: credit, label: Πηγή φωτογραφίας (π.χ. Φωτ. Όνομα), widget: string}
              - {name: link, label: Σελίδα (π.χ. zagori.html), widget: string}
              - {name: image, label: Εικόνα, widget: image}
              - {name: alt, label: Περιγραφή εικόνας, widget: string}
              - {name: width, label: Πλάτος εικόνας (px), widget: number, value_type: int, default: 1000}
              - {name: height, label: Ύψος εικόνας (px), widget: number, value_type: int, default: 667}
  - name: articles
    label: 'Γνωρίστε την Ήπειρο · Άρθρα'
    description: 'Σελίδα «Γνωρίστε την Ήπειρο»: κείμενα και φωτογραφίες των αφιερωμάτων, ή νέο άρθρο.'
    label_singular: Άρθρο
    folder: content/articles
    extension: json
    format: json
    create: true
    delete: false
    identifier_field: slug
    slug: '{{fields.slug}}'
    summary: '{{title}}'
    fields:
      - {name: slug, label: 'Όνομα σελίδας (λατινικά, μικρά, χωρίς κενά, π.χ. kreatopita)', widget: string, pattern: ['^[a-z0-9-]+$', 'Μόνο λατινικά μικρά γράμματα, αριθμοί και παύλες']}
      - {name: title, label: Τίτλος, widget: string}
      - {name: subtitle, label: Υπότιτλος, widget: string}
      - {name: eyebrow, label: 'Κατηγορία πάνω από τον τίτλο (π.χ. Εποχικά έθιμα)', widget: string}
      - {name: hero, label: Εικόνα κεφαλίδας, widget: image, required: false}
      - {name: hero_alt, label: Περιγραφή εικόνας κεφαλίδας (για άτομα με πρόβλημα όρασης), widget: string, required: false}
      - {name: lede, label: Εισαγωγική παράγραφος, widget: text}
      - {name: chapter_label, label: Σύντομος τίτλος που εμφανίζεται πάνω από κάθε ενότητα, widget: string}
      - name: chapters
        label: Ενότητες
        label_singular: Ενότητα
        widget: list
        summary: '{{fields.title}}'
        fields:
          - {name: title, label: Τίτλος ενότητας, widget: string}
          - {name: body, label: Κείμενο, widget: text, hint: 'Κενή γραμμή = νέα παράγραφος. Υπότιτλος: ### Τίτλος. Σύνδεσμος: [κείμενο](https://…). Παραπομπή σε πηγή: [[1]]. Φωτογραφία: [[φωτο 1]] (βλ. παρακάτω).'}
          - name: photos
            label: Φωτογραφίες της ενότητας (εμφανίζονται εκεί όπου γράψετε [[φωτο 1]], [[φωτο 2]]…)
            label_singular: Φωτογραφία
            widget: list
            required: false
            summary: '{{fields.caption}}'
            fields:
              - {name: image, label: Φωτογραφία, widget: image}
              - {name: alt, label: Περιγραφή (για άτομα με πρόβλημα όρασης), widget: string}
              - {name: caption, label: Λεζάντα, widget: string}
              - {name: credit, label: 'Πηγή / δικαιώματα (π.χ. Φωτογραφία: © Όνομα)', widget: string}
      - name: sources
        label: Πηγές (αριθμούνται 1, 2, 3… με τη σειρά)
        label_singular: Πηγή
        widget: list
        required: false
        summary: '{{fields.title}}'
        fields:
          - {name: title, label: Τίτλος πηγής, widget: string}
          - {name: url, label: Διεύθυνση (https://…), widget: string}
      - name: related
        label: Σχετικά αφιερώματα
        label_singular: Σύνδεσμος
        widget: list
        required: false
        fields:
          - {name: title, label: Τίτλος, widget: string}
          - {name: url, label: 'Σελίδα (π.χ. geuseis.html)', widget: string}
      - {name: show_on_ipeiros, label: Να εμφανιστεί κάρτα στη σελίδα «Γνωρίστε την Ήπειρο» (μόνο για νέα άρθρα), widget: boolean, default: false, required: false}
      - {name: card_image, label: Εικόνα κάρτας (μόνο για νέα άρθρα), widget: image, required: false}
