name: Import Metsovo vineyard media
on:
  push:
    paths: ['.github/workflows/import-vineyard.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - run: python scripts/import-vineyard.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/epirus-features/vineyard
          git diff --cached --quiet || git commit -m "Import official Metsovo vineyard media"
          git push
