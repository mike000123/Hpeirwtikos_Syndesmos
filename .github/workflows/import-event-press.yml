name: Import original event press documents
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyMuPDF==1.26.5
      - name: Download and render association documents
        shell: python
        run: |
          import json, pathlib, urllib.request, time, hashlib
          import pymupdf
          root = pathlib.Path('assets/event-press')
          root.mkdir(exist_ok=True)
          text = pathlib.Path('assets/events-data.js').read_text()
          data = json.loads(text[text.index('{'):].strip().removesuffix(';'))
          result = {}
          for event in data['events']:
              press = event.get('press')
              if not press:
                  continue
              original = press.get('originalSrc', press['src'])
              assert original.startswith('https://ipirotikos.gr/wp-content/uploads/')
              payload = None
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(original, headers={'User-Agent': 'EpirusAssociationArchive/1.0'})
                      with urllib.request.urlopen(request, timeout=45) as response:
                          payload = response.read()
                      break
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(2)
              suffix = 'pdf' if press['format'] == 'pdf' else 'jpg'
              filename = event['id'] + '.' + suffix
              target = root / filename
              target.write_bytes(payload)
              pages = []
              if suffix == 'pdf':
                  assert payload.startswith(b'%PDF-'), original
                  doc = pymupdf.open(target)
                  assert len(doc) > 0
                  for number, page in enumerate(doc, 1):
                      output = root / (event['id'] + '-page-' + str(number) + '.jpg')
                      page.get_pixmap(matrix=pymupdf.Matrix(1.7, 1.7), alpha=False).save(output, jpg_quality=88)
                      pages.append(str(output))
              else:
                  assert payload.startswith(b'\xff\xd8'), original
                  pages.append(str(target))
              result[event['id']] = {'src': str(target), 'pages': pages, 'original': original, 'sha256': hashlib.sha256(payload).hexdigest()}
          assert len(result) == 15
          pathlib.Path('assets/events-press-local.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n')
      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/event-press assets/events-press-local.json
          git diff --cached --quiet || git commit -m "Archive original event documents and page previews locally"
          git push
