name: Import scenic region photographs
on:
  push:
    paths: ['.github/workflows/import-region-scenic.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - run: python -u scripts/review-region-scenic.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/region-scenic
          git diff --cached --quiet || git commit -m "Import licensed scenic region photograph candidates"
          git push
