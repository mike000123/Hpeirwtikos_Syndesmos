name: Ενημέρωση σελίδων από τον πίνακα ελέγχου
on:
  push:
    branches: [main]
    paths: ['content/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-content
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install markdown pillow && sudo apt-get install -y fonts-dejavu-core >/dev/null
      - name: Build
        run: |
          python scripts/build-content.py
          python scripts/seo.py
          if [ -f .og-needed ]; then python scripts/make-og.py $(cat .og-needed); rm .og-needed; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Αυτόματη ενημέρωση σελίδων από τον πίνακα ελέγχου" && git pull --rebase origin main && git push origin HEAD:main)
