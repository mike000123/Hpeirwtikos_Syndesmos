name: Import licensed Epirus feature photographs
on:
  push:
    paths: ['.github/workflows/import-epirus-features.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - run: python scripts/import-epirus-features.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/epirus-features
          git diff --cached --quiet || git commit -m "Add documented photographs for remaining Epirus features"
          git push
