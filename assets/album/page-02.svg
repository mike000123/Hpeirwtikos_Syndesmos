<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100" role="img" aria-label="Ενδεικτική σελίδα: Μια συλλογική διαδρομή">
<defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#eee0c7"/></linearGradient></defs>
<rect width="800" height="1100" fill="url(#paper)"/><rect x="28" y="28" width="744" height="1044" rx="2" fill="none" stroke="#c6ac7e"/>
<text x="400" y="76" fill="#9a7843" text-anchor="middle" font-size="17" font-family="Arial, sans-serif">ΤΟ ΛΕΥΚΩΜΑ ΤΟΥ ΣΥΝΔΕΣΜΟΥ</text>
<text x="400" y="144" fill="#721f2d" text-anchor="middle" font-size="42" font-family="Georgia, serif">Μια συλλογική διαδρομή</text>
<path d="M255 174h290" stroke="#ba9555"/>
<text x="400" y="320" fill="#594d43" text-anchor="middle" font-size="25" font-family="Arial, sans-serif">Πίσω από κάθε επιστολή, ένας άνθρωπος.</text><text x="400" y="370" fill="#594d43" text-anchor="middle" font-size="25" font-family="Arial, sans-serif">Πίσω από κάθε έγγραφο, μια πράξη προσφοράς.</text><text x="400" y="420" fill="#594d43" text-anchor="middle" font-size="25" font-family="Arial, sans-serif">Πίσω από κάθε εικόνα, μια συνάντηση.</text><text x="400" y="520" fill="#594d43" text-anchor="middle" font-size="25" font-family="Arial, sans-serif">Το λεύκωμα συγκεντρώνει επιλεγμένα τεκμήρια</text><text x="400" y="570" fill="#594d43" text-anchor="middle" font-size="25" font-family="Arial, sans-serif">από τη διαδρομή του Συνδέσμου και φέρνει</text><text x="400" y="620" fill="#594d43" text-anchor="middle" font-size="25" font-family="Arial, sans-serif">τη μνήμη της κοινότητας κοντά σε όλους.</text><text x="400" y="720" fill="#594d43" text-anchor="middle" font-size="25" font-family="Arial, sans-serif">Οι επόμενες σελίδες είναι ενδεικτικές.</text><text x="400" y="770" fill="#594d43" text-anchor="middle" font-size="25" font-family="Arial, sans-serif">Θα αντικατασταθούν από το πραγματικό λεύκωμα.</text>
<path d="M200 975h400" stroke="#c6ac7e"/>
<text x="400" y="1012" fill="#594d43" text-anchor="middle" font-size="17" font-family="Arial, sans-serif">Ενδεικτική σελίδα · Δεν αποτελεί αρχειακό τεκμήριο.</text>
<text x="400" y="1044" fill="#907044" text-anchor="middle" font-size="18" font-family="Arial, sans-serif">2</text>
</svg>