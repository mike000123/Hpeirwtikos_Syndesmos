name: Import licensed silversmithing photographs
on:
  push:
    paths: ['.github/workflows/import-asimi-images.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - run: python scripts/import-asimi-images.py
      - name: Save licensed photographs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/asimi
          git diff --cached --quiet || git commit -m "Add licensed photographs from the Ioannina Silversmithing Museum"
          git push
