<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100" role="img" aria-label="Ενδεικτική σελίδα: Η μνήμη συνεχίζεται">
<defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#eee0c7"/></linearGradient></defs>
<rect width="800" height="1100" fill="url(#paper)"/><rect x="28" y="28" width="744" height="1044" rx="2" fill="none" stroke="#c6ac7e"/>
<text x="400" y="76" fill="#9a7843" text-anchor="middle" font-size="17" font-family="Arial, sans-serif">ΤΟ ΛΕΥΚΩΜΑ ΤΟΥ ΣΥΝΔΕΣΜΟΥ</text>
<text x="400" y="144" fill="#721f2d" text-anchor="middle" font-size="42" font-family="Georgia, serif">Η μνήμη συνεχίζεται</text>
<path d="M255 174h290" stroke="#ba9555"/>
<text x="400" y="365" fill="#721f2d" text-anchor="middle" font-size="27" font-family="Georgia, serif">Η ιστορία συνεχίζεται.</text><text x="400" y="420" fill="#594d43" text-anchor="middle" font-size="24" font-family="Arial, sans-serif">Μέσα από τους ανθρώπους που τη μοιράζονται.</text><text x="400" y="550" fill="#594d43" text-anchor="middle" font-size="24" font-family="Arial, sans-serif">Η ενδεικτική περιήγηση ολοκληρώθηκε.</text><text x="400" y="600" fill="#594d43" text-anchor="middle" font-size="24" font-family="Arial, sans-serif">Το πραγματικό λεύκωμα θα πάρει τη θέση της,</text><text x="400" y="650" fill="#594d43" text-anchor="middle" font-size="24" font-family="Arial, sans-serif">με το δικό του εξώφυλλο και τις δικές του σελίδες.</text><text x="400" y="780" fill="#721f2d" text-anchor="middle" font-size="24" font-family="Georgia, serif">Ηπειρωτικός Σύνδεσμος Πειραιώς</text><text x="400" y="825" fill="#594d43" text-anchor="middle" font-size="24" font-family="Arial, sans-serif">Από το 1886</text>
<path d="M200 975h400" stroke="#c6ac7e"/>
<text x="400" y="1012" fill="#594d43" text-anchor="middle" font-size="17" font-family="Arial, sans-serif">Ενδεικτική σελίδα · Δεν αποτελεί αρχειακό τεκμήριο.</text>
<text x="400" y="1044" fill="#907044" text-anchor="middle" font-size="18" font-family="Arial, sans-serif">6</text>
</svg>